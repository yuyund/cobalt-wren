name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: mypy src
      - run: MYPYPATH=src:packages/opportunity_research_workflow/src mypy packages/opportunity_research_workflow/src/opportunity_research_workflow
      - run: MYPYPATH=src:packages/human_approval_workflow/src mypy packages/human_approval_workflow/src/human_approval_workflow
      - run: MYPYPATH=src:packages/saga_workflow/src mypy packages/saga_workflow/src/saga_workflow
      - run: MYPYPATH=src:packages/plain_python_workflow/src mypy packages/plain_python_workflow/src/plain_python_workflow
      - run: python scripts/classify_mypy.py --check-baseline
      - run: python scripts/benchmark_runtime.py --iterations 5 --output /tmp/runtime-benchmark.json
