[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-research-workflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "langgraph-automation>=0.1.0",
  "langgraph>=0.2",
]

[project.entry-points."langgraph_automation.plugins"]
opportunity-research = "opportunity_research_workflow:create_plugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
