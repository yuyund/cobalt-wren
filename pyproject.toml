[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django",
  "psycopg",
  "langgraph",
  "litellm",
  "django-environ",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-django",
  "ruff",
  "mypy",
  "django-stubs>=5.2,<6",
  "django-stubs-ext>=5.2,<6",
]
postgres = [
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-django",
  "ruff",
  "mypy",
  "django-stubs>=5.2,<6",
  "django-stubs-ext>=5.2,<6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
langgraph_automation = ["py.typed"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "langgraph_automation.config.settings"
pythonpath = ["src"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "langgraph_automation.config.settings"
strict_settings = true

[[tool.mypy.overrides]]
module = "environ"
ignore_missing_imports = true
