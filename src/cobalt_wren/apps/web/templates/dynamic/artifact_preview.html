{% extends 'base.html' %}{% block title %}Artifact Preview{% endblock %}{% block content %}
<div class="page-header d-print-none"><div class="row align-items-center"><div class="col"><h1 class="page-title">Artifact Preview</h1><div class="text-secondary mt-1">{{ artifact.name }} · {{ content_type }} · {{ artifact.size }} bytes</div></div><div class="col-auto ms-auto"><a class="btn btn-primary" href="/ui/artifacts/{{ artifact.pk }}/download/">Download</a></div></div></div>
<div class="card mt-3"><div class="card-body"><pre class="artifact-preview mb-0">{{ preview }}</pre></div></div>{% endblock %}
