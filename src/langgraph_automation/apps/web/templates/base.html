<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Automation Control Plane{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; line-height: 1.45; }
    * { box-sizing: border-box; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    header { border-bottom: 1px solid color-mix(in srgb, CanvasText 20%, transparent); background: color-mix(in srgb, Canvas 92%, CanvasText 8%); }
    .shell { width: min(1180px, calc(100% - 2rem)); margin: 0 auto; }
    header .shell { display: flex; gap: 1.25rem; align-items: center; padding: .85rem 0; overflow-x: auto; }
    .brand { font-weight: 700; white-space: nowrap; }
    nav { display: flex; gap: .85rem; }
    nav a, a { color: LinkText; }
    main { padding: 1.5rem 0 3rem; }
    h1 { margin: 0 0 1.25rem; font-size: clamp(1.5rem, 3vw, 2rem); }
    h2 { margin-top: 2rem; font-size: 1.2rem; }
    section { margin-bottom: 1.4rem; }
    .table-wrap { width: 100%; overflow-x: auto; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: .5rem; }
    table { width: 100%; border-collapse: collapse; min-width: 720px; }
    th, td { padding: .65rem .75rem; text-align: left; border-bottom: 1px solid color-mix(in srgb, CanvasText 14%, transparent); vertical-align: top; }
    th { font-size: .82rem; text-transform: uppercase; letter-spacing: .035em; background: color-mix(in srgb, Canvas 90%, CanvasText 10%); }
    tr:last-child td { border-bottom: 0; }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: .75rem; }
    .detail-field { padding: .75rem; border: 1px solid color-mix(in srgb, CanvasText 15%, transparent); border-radius: .45rem; overflow-wrap: anywhere; }
    .detail-field strong { display: block; font-size: .78rem; text-transform: uppercase; opacity: .72; margin-bottom: .25rem; }
    .actions { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .8rem; padding: 1rem; border-radius: .55rem; background: color-mix(in srgb, Canvas 91%, CanvasText 9%); }
    .action-form { display: grid; gap: .45rem; min-width: min(280px, 100%); }
    label { display: grid; gap: .25rem; font-size: .88rem; }
    input, textarea, select, button, .button { font: inherit; padding: .52rem .65rem; border-radius: .38rem; border: 1px solid color-mix(in srgb, CanvasText 28%, transparent); }
    textarea { min-height: 6rem; resize: vertical; }
    button, .button { cursor: pointer; background: ButtonFace; color: ButtonText; text-decoration: none; display: inline-block; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    pre.artifact-preview { max-height: 70vh; overflow: auto; padding: 1rem; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: .5rem; white-space: pre-wrap; overflow-wrap: anywhere; background: color-mix(in srgb, Canvas 94%, CanvasText 6%); }
    .status { display: inline-block; padding: .12rem .45rem; border-radius: 999px; font-size: .82rem; font-weight: 650; background: color-mix(in srgb, Canvas 80%, CanvasText 20%); }
    @media (max-width: 640px) { .shell { width: min(100% - 1rem, 1180px); } main { padding-top: 1rem; } }
  </style>
</head>
<body>
<header>
  <div class="shell">
    <div class="brand">Automation Control Plane</div>
    <nav aria-label="Primary">
      <a href="/ui/runs/">Runs</a>
      <a href="/ui/workflows/">Workflows</a>
      <a href="/ui/artifacts/">Artifacts</a>
      <a href="/ui/checkpoints/">Checkpoints</a>
      <a href="/ui/events/">Events</a>
      <a href="/ui/spans/">Spans</a>
    </nav>
  </div>
</header>
<main class="shell">{% block content %}{% endblock %}</main>
</body>
</html>
