{% extends 'base.html' %}
{% block title %}Artifact Preview{% endblock %}
{% block content %}
<h1>Artifact Preview</h1>
<p><strong>{{ artifact.name }}</strong> · {{ content_type }} · {{ artifact.size }} bytes</p>
<pre class="artifact-preview">{{ preview }}</pre>
<p><a href="/ui/artifacts/{{ artifact.pk }}/download/">Download</a></p>
{% endblock %}
