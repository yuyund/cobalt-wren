<section>
  <h2>{{ section.title }}</h2>
  {% if section.table.rows %}
  <table>
    <thead>
      <tr>
        {% for column in section.table.columns %}
        <th>{{ column.label }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in section.table.rows %}
      <tr>
        {% for field in row %}
        <td>{{ field.display_value }}</td>
        {% endfor %}
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <p>{{ section.table.empty_message }}</p>
  {% endif %}
</section>
